kind = "web"
previewPath = "/"
title = "DOKRA Running Club Admin Panel"
version = "1.0.0"
id = "artifacts/dokra-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18755

[services.development]
run = "pnpm --filter @workspace/dokra-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dokra-admin", "run", "build" ]
publicDir = "artifacts/dokra-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18755"
BASE_PATH = "/"
